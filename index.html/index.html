```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>System Check</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #030303;
        color: #ddd;
        font-family: Consolas, monospace;
      }

      body {
        cursor: none;
      }

      /* =========================
   MAIN SCREEN
========================= */

      #app {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          circle at center,
          #151515 0%,
          #080808 45%,
          #000 100%
        );
      }

      #noise {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0.08;

        background-image: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.08) 0px,
          transparent 1px,
          transparent 4px
        );

        animation: noise 0.12s infinite;
      }

      #vignette {
        position: fixed;
        inset: 0;
        z-index: 51;
        pointer-events: none;

        background: radial-gradient(
          circle,
          transparent 35%,
          rgba(0, 0, 0, 0.85) 100%
        );
      }

      /* =========================
   FAKE WEBSITE
========================= */

      #website {
        position: absolute;
        inset: 0;

        display: flex;
        flex-direction: column;
      }

      header {
        height: 60px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 30px;

        border-bottom: 1px solid #202020;

        background: #070707;
      }

      .logo {
        color: #aaa;
        letter-spacing: 3px;
        font-size: 12px;
      }

      .status {
        color: #4d8b72;
        font-size: 10px;
      }

      main {
        flex: 1;

        display: flex;
        align-items: center;
        justify-content: center;

        text-align: center;
      }

      .card {
        width: min(500px, 90vw);

        padding: 35px;

        border: 1px solid #222;

        background: rgba(10, 10, 10, 0.7);

        box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);

        transition: 0.5s;
      }

      .card h1 {
        color: #ddd;

        font-size: 24px;

        margin-bottom: 15px;

        letter-spacing: 3px;
      }

      .card p {
        color: #666;

        font-size: 11px;

        line-height: 2;

        margin-bottom: 25px;
      }

      .progress {
        width: 100%;
        height: 3px;

        background: #171717;

        overflow: hidden;
      }

      .progress span {
        display: block;

        width: 0;
        height: 100%;

        background: #777;

        transition: width 0.2s;
      }

      #begin {
        margin-top: 25px;

        padding: 10px 25px;

        background: #111;

        color: #aaa;

        border: 1px solid #333;

        font-family: inherit;

        cursor: pointer;
      }

      #begin:hover {
        background: #191919;
      }

      /* =========================
   CURSOR
========================= */

      #cursor {
        position: fixed;

        width: 180px;
        height: 180px;

        border-radius: 50%;

        pointer-events: none;

        z-index: 40;

        transform: translate(-50%, -50%);

        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.09),
          transparent 65%
        );
      }

      /* =========================
   CORRUPTION
========================= */

      .corrupt {
        color: #8b8b8b !important;
      }

      .glitch {
        animation: glitch 0.08s infinite;
      }

      @keyframes glitch {
        0% {
          transform: translate(0);
        }

        25% {
          transform: translate(4px, -2px);
        }

        50% {
          transform: translate(-4px, 2px);
        }

        75% {
          transform: translate(2px, 1px);
        }

        100% {
          transform: translate(0);
        }
      }

      /* =========================
   ALERT
========================= */

      #alert {
        position: fixed;
        inset: 0;

        z-index: 70;

        display: none;

        align-items: center;
        justify-content: center;

        background: #000;

        text-align: center;
      }

      .alertText {
        color: #777;

        font-size: 12px;

        letter-spacing: 5px;

        line-height: 2.5;
      }

      /* =========================
   SHADOW
========================= */

      #shadow {
        position: fixed;

        z-index: 65;

        width: 80px;
        height: 220px;

        background: #000;

        border-radius: 50% 50% 20% 20%;

        filter: blur(14px);

        opacity: 0;

        pointer-events: none;

        transition: opacity 1s;
      }

      /* =========================
   FINAL
========================= */

      #final {
        position: fixed;
        inset: 0;

        z-index: 100;

        display: none;

        align-items: center;
        justify-content: center;

        background: #000;
      }

      /* face */

      .face {
        position: relative;

        width: 300px;
        height: 360px;

        border-radius: 48% 48% 45% 45%;

        background: radial-gradient(ellipse at center, #181818, #030303 65%);

        box-shadow: 0 0 100px #000;
      }

      .eye {
        position: absolute;

        top: 110px;

        width: 70px;
        height: 34px;

        border-radius: 50%;

        background: #ddd;

        box-shadow: 0 0 20px #fff;
      }

      .eye:after {
        content: "";

        position: absolute;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        width: 13px;
        height: 28px;

        border-radius: 50%;

        background: #000;
      }

      .eye.left {
        left: 55px;
      }

      .eye.right {
        right: 55px;
      }

      .mouth {
        position: absolute;

        left: 50%;
        bottom: 80px;

        transform: translateX(-50%);

        width: 130px;
        height: 40px;

        border-bottom: 5px solid #aaa;

        border-radius: 0 0 70% 70%;
      }

      /* =========================
   FINAL MESSAGE
========================= */

      #finalMessage {
        position: fixed;

        z-index: 120;

        bottom: 30px;

        left: 0;
        right: 0;

        text-align: center;

        color: #555;

        font-size: 10px;

        letter-spacing: 4px;

        opacity: 0;
      }

      /* =========================
   SHAKE
========================= */

      .shake {
        animation: shake 0.06s infinite;
      }

      @keyframes shake {
        0% {
          transform: translate(0, 0);
        }

        25% {
          transform: translate(7px, -4px);
        }

        50% {
          transform: translate(-7px, 4px);
        }

        75% {
          transform: translate(4px, 5px);
        }

        100% {
          transform: translate(0, 0);
        }
      }

      .flash {
        animation: flash 0.08s infinite;
      }

      @keyframes flash {
        0%,
        100% {
          filter: none;
        }

        50% {
          filter: brightness(3);
        }
      }

      @keyframes noise {
        0% {
          transform: translate(0);
        }

        25% {
          transform: translate(2px, -1px);
        }

        50% {
          transform: translate(-1px, 2px);
        }

        75% {
          transform: translate(1px, 1px);
        }

        100% {
          transform: translate(0);
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div id="website">
        <header>
          <div class="logo">SYSTEM CHECK</div>

          <div class="status" id="status">● ONLINE</div>
        </header>

        <main>
          <div class="card">
            <h1 id="title">DEVICE DIAGNOSTIC</h1>

            <p id="description">
              This page will perform a short browser system check. Nothing will
              be changed.
            </p>

            <div class="progress">
              <span id="bar"></span>
            </div>

            <button id="begin">START CHECK</button>
          </div>
        </main>
      </div>
    </div>

    <div id="cursor"></div>

    <div id="noise"></div>
    <div id="vignette"></div>

    <!-- ALERT -->

    <div id="alert">
      <div class="alertText" id="alertText">INITIALIZING...</div>
    </div>

    <!-- SHADOW -->

    <div id="shadow"></div>

    <!-- FINAL -->

    <div id="final">
      <div class="face">
        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="mouth"></div>
      </div>
    </div>

    <div id="finalMessage">CONNECTION CLOSED</div>

    <script>
      /* =========================
   CURSOR
========================= */

      const cursor = document.getElementById("cursor");

      document.addEventListener("mousemove", (e) => {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
      });

      /* =========================
   AUDIO ENGINE
========================= */

      let audio = null;

      function sound(freq, duration, type = "sine", volume = 0.03) {
        try {
          if (!audio) {
            audio = new AudioContext();
          }

          const osc = audio.createOscillator();

          const gain = audio.createGain();

          osc.type = type;

          osc.frequency.value = freq;

          gain.gain.value = volume;

          osc.connect(gain);

          gain.connect(audio.destination);

          osc.start();

          setTimeout(() => {
            osc.stop();
          }, duration);
        } catch (e) {}
      }

      /* =========================
   BUTTON
========================= */

      document.getElementById("begin").addEventListener("click", start);

      /* =========================
   START
========================= */

      function start() {
        const button = document.getElementById("begin");

        button.style.display = "none";

        if (audio) {
          audio.resume();
        }

        sound(220, 120, "sine", 0.03);

        const bar = document.getElementById("bar");

        const title = document.getElementById("title");

        const description = document.getElementById("description");

        const status = document.getElementById("status");

        let progress = 0;

        const interval = setInterval(() => {
          progress += Math.random() * 5 + 2;

          if (progress > 100) progress = 100;

          bar.style.width = progress + "%";

          if (progress > 25) {
            title.textContent = "CHECKING BROWSER...";
          }

          if (progress > 45) {
            description.textContent = "Analyzing display environment...";
          }

          if (progress > 65) {
            description.textContent = "Checking active window...";
          }

          if (progress > 82) {
            description.textContent = "Checking camera access...";

            status.textContent = "● CHECKING";
          }

          if (progress >= 100) {
            clearInterval(interval);

            setTimeout(corruptPage, 1200);
          }
        }, 180);
      }

      /* =========================
   CORRUPT
========================= */

      function corruptPage() {
        const title = document.getElementById("title");

        const description = document.getElementById("description");

        title.classList.add("glitch");

        title.textContent = "UNEXPECTED SIGNAL";

        description.textContent = "A second display source has been detected.";

        sound(90, 400, "sawtooth", 0.025);

        setTimeout(() => {
          description.textContent = "Source: UNKNOWN";
        }, 1300);

        setTimeout(() => {
          description.textContent = "It appears to be inside this page.";
        }, 2600);

        setTimeout(() => {
          disappear();
        }, 4300);
      }

      /* =========================
   DISAPPEAR
========================= */

      function disappear() {
        document.getElementById("website").style.opacity = "0";

        sound(55, 700, "sine", 0.04);

        setTimeout(() => {
          document.getElementById("alert").style.display = "flex";

          runAlert();
        }, 1800);
      }

      /* =========================
   ALERT SEQUENCE
========================= */

      function runAlert() {
        const text = document.getElementById("alertText");

        const messages = [
          "DISPLAY SIGNAL LOST",

          "RECONNECTING...",

          "SECOND SOURCE FOUND",

          "LOCATION: THIS WINDOW",

          "DO NOT CLOSE THIS TAB",
        ];

        let i = 0;

        function next() {
          if (i >= messages.length) {
            setTimeout(showShadow, 1000);

            return;
          }

          text.textContent = messages[i];

          sound(120 + i * 20, 180, "square", 0.025);

          i++;

          setTimeout(next, 1000);
        }

        next();
      }

      /* =========================
   SHADOW
========================= */

      function showShadow() {
        document.getElementById("alert").style.display = "none";

        const shadow = document.getElementById("shadow");

        shadow.style.opacity = ".9";

        shadow.style.left = "calc(50% - 40px)";

        shadow.style.top = "20%";

        sound(70, 600, "sine", 0.035);

        setTimeout(() => {
          shadow.style.left = "65%";
        }, 1500);

        setTimeout(() => {
          shadow.style.left = "30%";
        }, 2800);

        setTimeout(() => {
          shadow.style.opacity = "0";

          finalCountdown();
        }, 4200);
      }

      /* =========================
   COUNTDOWN
========================= */

      function finalCountdown() {
        const app = document.getElementById("app");

        app.classList.add("shake");

        const text = document.getElementById("finalMessage");

        text.style.opacity = "1";

        text.textContent = "TURN AROUND";

        sound(45, 900, "sine", 0.04);

        setTimeout(() => {
          text.textContent = "3";

          sound(100, 100);
        }, 1500);

        setTimeout(() => {
          text.textContent = "2";

          sound(100, 100);
        }, 2200);

        setTimeout(() => {
          text.textContent = "1";

          sound(100, 100);
        }, 2900);

        setTimeout(jumpscare, 3600);
      }

      /* =========================
   JUMPSCARE
========================= */

      function jumpscare() {
        document.getElementById("final").style.display = "flex";

        document.getElementById("final").classList.add("shake");

        document.getElementById("final").classList.add("flash");

        document.getElementById("finalMessage").textContent =
          "I WAS ALREADY HERE.";

        /* alarm */

        sound(70, 800, "sawtooth", 0.08);

        setTimeout(() => {
          sound(180, 500, "square", 0.06);
        }, 100);

        setTimeout(() => {
          document.getElementById("finalMessage").textContent = "JUST KIDDING.";
        }, 2500);
      }
    </script>
  </body>
</html>
