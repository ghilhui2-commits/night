<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ភ្លៀងកូដអក្សរខ្មែរ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Moul&family=Noto+Sans+Khmer:wght@600&display=swap" rel="stylesheet">
<style>
  /* ពណ៌ទាំងអស់នៅទីនេះ — JavaScript អានពីទីនេះដើម្បីគូរ */
  :root {
    --bg: #eef2fb;
    --glyph: #9a5f00;
    --head: #1b2150;
    --hint: #4a5280;
    --glow: #ffffff;
    --scrim: rgba(238, 242, 251, 0.85);
    --dark: 0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0e26;
      --glyph: #e6ad3f;
      --head: #fff0c4;
      --hint: #9aa3cc;
      --glow: #e6ad3f;
      --scrim: rgba(10, 14, 38, 0.8);
      --dark: 1;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0e26;
    --glyph: #e6ad3f;
    --head: #fff0c4;
    --hint: #9aa3cc;
    --glow: #e6ad3f;
    --scrim: rgba(10, 14, 38, 0.8);
    --dark: 1;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--head);
    font-family: "Noto Sans Khmer", "Khmer OS System", "Khmer Sangam MN", "Leelawadee UI", sans-serif;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none; /* ឲ្យអូសម្រាមដៃបាន ដោយមិនរំកិលទំព័រ */
  }

  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: env(safe-area-inset-top, 0px) 20px env(safe-area-inset-bottom, 0px);
    pointer-events: none;
  }
  h1 {
    margin: 0;
    padding: 0.6em 1.2em;
    font-family: "Moul", "Noto Sans Khmer", "Khmer OS Muol", serif;
    font-weight: 400;
    font-size: clamp(26px, 8.5vw, 58px);
    line-height: 1.9;
    text-align: center;
    text-wrap: balance;
    color: var(--head);
    text-shadow: 0 0 22px var(--glow);
    background: radial-gradient(closest-side, var(--scrim), transparent);
  }

  .hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    margin: 0;
    padding: 0 24px calc(env(safe-area-inset-bottom, 0px) + 22px);
    text-align: center;
    font-size: 15px;
    line-height: 1.8;
    color: var(--hint);
    pointer-events: none;
    transition: opacity 0.6s;
  }
  .touched .hint { opacity: 0; }
</style>
</head>
<body>
<canvas id="rain" role="img" aria-label="ភ្លៀងកូដអក្សរខ្មែរ"></canvas>
<div class="stage"><h1>សួស្តី ពិភពលោក</h1></div>
<p class="hint">អូសម្រាមដៃលើអេក្រង់ ដើម្បីគូរភ្លៀងពណ៌</p>

<script>
(() => {
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const root = document.documentElement;
  const FONT = '"Noto Sans Khmer", "Khmer OS System", "Khmer Sangam MN", "Leelawadee UI", sans-serif';
  const motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.35 : 1;

  // តួអក្សរដែលនឹងធ្លាក់៖ ព្យញ្ជនៈខ្មែរ + លេខខ្មែរ + និមិត្តសញ្ញាកូដ
  const GLYPHS = Array.from('កខគឃងចឆជឈញដឋឌឍណតថទធនបផពភមយរលវសហឡអ០១២៣៤៥៦៧៨៩{}<>/=;');
  const rnd = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

  // អានពណ៌ពី CSS (ដំណើរការទាំងរបៀបភ្លឺ និងងងឹត)
  let C = {};
  const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
  function readTheme() {
    C = { bg: css('--bg'), glyph: css('--glyph'), head: css('--head'), dark: css('--dark') === '1' };
  }
  readTheme();

  let W = 0, H = 0, dpr = 1, size = 18, rows = 0, offsetX = 0;
  const columns = [];

  // កំណត់តំណក់ភ្លៀងមួយជួរឡើងវិញ៖ ប្រវែង ល្បឿន និងទីតាំងចាប់ផ្តើម
  function spawn(c, first) {
    c.len = 12 + ((Math.random() * 22) | 0);          // ប្រវែងកន្ទុយ (ជួរឈរ)
    c.speed = (10 + Math.random() * 16) * motion;     // ល្បឿន (ជួរ/វិនាទី)
    c.y = first ? Math.random() * (rows + c.len) : -Math.random() * rows * 0.25;
    c.top = -Infinity;
    c.hue = null;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    size = Math.round(Math.min(26, Math.max(16, W / 22)));
    rows = Math.ceil(H / size) + 1;
    const n = Math.floor(W / size);
    offsetX = (W - n * size) / 2;

    while (columns.length < n) {
      const c = { chars: [] };
      spawn(c, true);
      columns.push(c);
    }
    columns.length = n;
    for (const c of columns) while (c.chars.length < rows) c.chars.push(rnd());
  }

  // គូរគ្រប់ frame៖ លុបអេក្រង់ រួចគូរតួអក្សរនៃជួរនីមួយៗ ពីកន្ទុយទៅក្បាល
  let last = performance.now();
  let themeClock = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    themeClock += dt;
    if (themeClock > 0.5) { themeClock = 0; readTheme(); }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.font = `600 ${size}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    columns.forEach((c, i) => {
      c.y += c.speed * dt;
      const head = Math.floor(c.y);
      if (head - c.len > rows) { spawn(c, false); return; }
      if (Math.random() < 0.2) c.chars[(Math.random() * rows) | 0] = rnd(); // លេចលោតតួអក្សរ

      const tinted = c.hue !== null;
      const body = tinted ? `hsl(${c.hue}, 95%, ${C.dark ? 62 : 38}%)` : C.glyph;
      const tip  = tinted ? `hsl(${c.hue}, 100%, ${C.dark ? 88 : 22}%)` : C.head;
      const x = offsetX + i * size + size / 2;

      for (let k = c.len; k >= 0; k--) {
        const r = head - k;
        if (r < 0 || r >= rows || r < c.top) continue;
        const isHead = k === 0;
        ctx.globalAlpha = isHead ? 1 : Math.pow(1 - k / (c.len + 1), 1.5); // កន្ទុយរសាត់បន្តិចម្តងៗ
        ctx.fillStyle = isHead ? tip : body;
        ctx.shadowColor = body;
        ctx.shadowBlur = isHead && C.dark ? size * dpr : 0;                  // ក្បាលភ្លឺរលោង
        ctx.fillText(c.chars[r], x, r * size + size / 2);
      }
    });

    requestAnimationFrame(frame);
  }

  // ប៉ះ ឬអូសម្រាមដៃ៖ ជួរដែលនៅក្រោមម្រាមដៃ ប្តូរពណ៌ ហើយចាប់ផ្តើមធ្លាក់ពីចំណុចនោះ
  let hue = 30;
  function paint(e) {
    document.body.classList.add('touched');
    hue = (hue + 9) % 360;
    const col = Math.floor((e.clientX - offsetX) / size);
    const row = Math.floor(e.clientY / size);
    for (let o = -1; o <= 1; o++) {
      const c = columns[col + o];
      if (!c) continue;
      c.hue = hue;
      c.y = row;
      c.top = row;
      c.len = 10 + ((Math.random() * 10) | 0);
      c.speed = (14 + Math.random() * 12) * motion;
    }
  }

  canvas.addEventListener('pointerdown', paint);
  canvas.addEventListener('pointermove', paint);
  window.addEventListener('resize', resize);
  resize();

  if (document.fonts && document.fonts.load) {
    document.fonts.load('600 20px "Noto Sans Khmer"', 'កខគ').catch(() => {});
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
